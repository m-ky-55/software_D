<script>
let board = [];
let TATE, YOKO, REN;
let turn = "O";
let gameOver = false;
let startMode = null; // "new" | "load"

function selectNewGame(){

    startMode = "new";

    document.getElementById("startMenu").style.display = "none";
    document.getElementById("newGameSettings").style.display = "block";
}
let showDeleteHistory = true; // 履歴削除ボタンを表示するかのフラグ

    // メニュー非表示、ゲームコンテナ表示

    document.getElementById("exitBtn").style.display = "inline-block";
    document.getElementById("turnInfo").textContent = "履歴から選んでください";

    // 🔹 履歴削除ボタンは非表示
    showDeleteHistory = false;

    // 盤面はまだ表示しないので gameContainer は非表示

    // 履歴だけ表示

}

    } else if(startMode === "load" && gameOver){

function startGame(){

    if(startMode !== "new"){
        alert("新規ゲームを選択してください");
        return;
    }

    gameOver = false;

    // 横・縦
    YOKO = parseInt(document.getElementById("yoko").value);
    TATE = parseInt(document.getElementById("tate").value);

    if(YOKO < 2) YOKO = 2; if(YOKO > 99) YOKO = 99;
    if(TATE < 2) TATE = 2; if(TATE > 99) TATE = 99;

    // 揃える駒数 (REN) の補正
    REN = parseInt(document.getElementById("ren").value);
    let maxRen = Math.max(TATE, YOKO);             // 横・縦のどちらか小さい方を上限に
    document.getElementById("ren").max = maxRen;   // inputの最大値も更新
    let minRen = Math.min(TATE, YOKO);             // 横・縦のどちらか小さい方を上限に
    document.getElementById("ren").min = minRen;   // inputの最大値も更新
    if(REN > maxRen){
        REN = maxRen;
        document.getElementById("ren").value = maxRen;
    }else if(REN < 2){
        REN = 2;
        document.getElementById("ren").value = minRen;
    }else{
        REN = parseInt(document.getElementById("ren").value);
    }

    // 穴割合
    let holeRate = parseInt(document.getElementById("holeRate").value);
    if(holeRate < 0) holeRate = 0;
    if(holeRate > 50) holeRate = 50;
    document.getElementById("holeRate").value = holeRate;

    // ボード初期化
    board = Array.from({length:TATE},()=>Array(YOKO).fill("."));

    let holeCount = Math.floor(TATE*YOKO*holeRate/100);
    let placed = 0;
    while(placed < holeCount){
        let r = Math.floor(Math.random()*TATE);
        let c = Math.floor(Math.random()*YOKO);
        if(board[r][c] === "."){
            board[r][c] = "#";
            placed++;
        }
    }

    turn = "O";

    const newGame = {
        id: Date.now(),
        name: "Game " + (historyFolders.length + 1),
        startTime: new Date().toLocaleString(),
        history: []
    };

    historyFolders.push(newGame);
    currentGameIndex = historyFolders.length - 1;

    saveSnapshot();

    // ゲーム画面表示
    document.getElementById("newGameSettings").style.display = "none";
    document.getElementById("gameContainer").style.display = "block";
    document.getElementById("container").style.display = "flex";
    document.getElementById("exitBtn").style.display = "inline-block";
    document.getElementById("deleteHistoryBtn").style.display = "inline-block";
    drawBoard();
    renderHistory();
}



function drawBoard(){
    let btnDiv = document.getElementById("columnButtons");
    let boardDiv = document.getElementById("board");

    btnDiv.style.gridTemplateColumns = `repeat(${YOKO}, 40px)`;
    boardDiv.style.gridTemplateColumns = `repeat(${YOKO}, 40px)`;

    btnDiv.innerHTML = "";
    boardDiv.innerHTML = "";

    // ▼ ボタン生成
    for(let c=0;c<YOKO;c++){
        let btn = document.createElement("button");
        btn.classList.add("colBtn");
        btn.textContent = "▼";
        btn.onclick = ()=>dropPiece(c);

        if(gameOver){
            btn.disabled = true;
            btn.style.background = "#999";
            btn.style.cursor = "not-allowed";
        }

        btnDiv.appendChild(btn);
    }

    

    // 盤面生成
    for(let r=0;r<TATE;r++){
        for(let c=0;c<YOKO;c++){
            let cell = document.createElement("div");
            cell.classList.add("cell");

            if(board[r][c]==="O") cell.classList.add("O");
            if(board[r][c]==="X") cell.classList.add("X");
            if(board[r][c]==="#") cell.classList.add("hole");

            boardDiv.appendChild(cell);
        }
    }
    document.getElementById("turnInfo").innerHTML =
    `Player <span class="turnPiece ${turn}"></span> の手番（${REN}連続で勝利）`;
    

}

async function dropPiece(col){

    if(gameOver) return;

    let targetRow = -1;

    // 最終着地点を探す
    for(let r=TATE-1;r>=0;r--){
        if(board[r][col] === "#") continue;
        if(board[r][col] === "."){
            targetRow = r;
            break;
        }
    }

    if(targetRow === -1) return;

    gameOver = true; // アニメ中ロック

    // 上から順に仮表示
    for(let r=0; r<=targetRow; r++){

        if(board[r][col] === "#") continue;

        drawBoard(); // 一旦通常描画

        // 仮描画用
        let boardDiv = document.getElementById("board");
        let index = r * YOKO + col;
        let cell = boardDiv.children[index];
        cell.classList.add(turn);

        await new Promise(res => setTimeout(res, 30));
    }

    // 正式に配置
    board[targetRow][col] = turn;

    gameOver = false;

    drawBoard();

    // 勝敗判定
    if(checkWin()){
        gameOver = true;

        // 手番表示を消す
        const turnInfo = document.getElementById("turnInfo");
        turnInfo.innerHTML = ""; // 手番表示をクリア

        // 勝利メッセージを画面に表示
        const msg = document.createElement("div");
        msg.style.fontSize = "40px";
        msg.style.fontWeight = "bold";
        msg.style.marginTop = "30px";
        // msg.innerHTML = `Player <span class="turnPiece ${turn}"></span> の勝利！<br>"終了"を押してゲーム終了`;
        msg.innerHTML = `
            Player <span class="turnPiece ${turn}"></span> の勝利！<br>
            <span style="font-size:20px;">
                "終了"を押してゲーム終了
            </span>
        `;

        turnInfo.appendChild(msg);

        return;
    }


    if(isFull()){
        gameOver = true;
        // 手番表示を消す
        const turnInfo = document.getElementById("turnInfo");
        turnInfo.innerHTML = ""; // 手番表示をクリア

        // 勝利メッセージを画面に表示
        const msg = document.createElement("div");
        msg.style.fontSize = "40px";
        msg.style.fontWeight = "bold";
        msg.style.marginTop = "30px";
        // msg.innerHTML = `引き分け！<br>"終了"を押してゲーム終了`;
        msg.innerHTML = `
            引き分け！<br>
            <span style="font-size:20px;">
                "終了"を押してゲーム終了
            </span>
        `;

        turnInfo.appendChild(msg);
        // alert("引き分け！");
        return;
    }

    turn = (turn==="O")?"X":"O";
    drawBoard();
    saveSnapshot();

}


function checkWin(){
    const dr=[0,1,1,1];
    const dc=[1,0,1,-1];

    for(let r=0;r<TATE;r++){
        for(let c=0;c<YOKO;c++){
            let p=board[r][c];
            if(p==="."||p==="#") continue;

            for(let d=0;d<4;d++){
                let count=1;
                for(let k=1;k<REN;k++){
                    let nr=r+dr[d]*k;
                    let nc=c+dc[d]*k;
                    if(nr<0||nr>=TATE||nc<0||nc>=YOKO) break;
                    if(board[nr][nc]===p) count++;
                    else break;
                }
                if(count===REN) return true;
            }
        }
    }
    return false;
}

function isFull(){
    for(let r=0;r<TATE;r++)
        for(let c=0;c<YOKO;c++)
            if(board[r][c]===".") return false;
    return true;
}

function sleep(ms){
    return new Promise(resolve => setTimeout(resolve, ms));
}

// シリアライズ化関数
function serializeBoard(){

    let flatBoard = board.flat().join(" ");

    return `TATE ${TATE}, YOKO ${YOKO}, TURN ${turn}, REN ${REN}, BOARD ${flatBoard}`;
}


let historyList = [];
let historyFolders = [];
let currentGameIndex = -1;

function saveSnapshot(){

    if(currentGameIndex === -1) return;

    const snapshot = {
        TATE,
        YOKO,
        REN,
        board: JSON.parse(JSON.stringify(board)),
        turn
    };

    historyFolders[currentGameIndex].history.push(snapshot);

    localStorage.setItem("historyFolders", JSON.stringify(historyFolders));

    renderHistory();
}


// 履歴表示関数
function renderHistory(){
    const tabsDiv = document.getElementById("historyTabs");
    const ul = document.getElementById("historyList");
    tabsDiv.innerHTML = "";
    ul.innerHTML = "";

    if(historyFolders.length === 0) return;

    // タブ作成（最新順）
    historyFolders.slice().reverse().forEach((folder, indexRev)=>{
        const index = historyFolders.length - 1 - indexRev; // 元の配列インデックス
        const btn = document.createElement("button");
        btn.textContent = folder.name;

        // ✅ 現在プレイ中のゲームなら色を変える
        if(index === currentGameIndex){
            btn.style.backgroundColor = "#f39c12"; // オレンジ色など
            btn.style.color = "white";
        } else {
            btn.style.backgroundColor = "#eee";
            btn.style.color = "#000";
        }

        btn.onclick = ()=> renderFolderHistory(index);
        tabsDiv.appendChild(btn);
    });

    // 初期表示は最新
    renderFolderHistory(historyFolders.length - 1);
}


// 履歴からゲームを選択したら盤面表示
function loadFromFolder(folderIndex, snapIndex){
    const data = historyFolders[folderIndex].history[snapIndex];

    TATE = data.TATE;
    YOKO = data.YOKO;
    REN = data.REN;
    board = JSON.parse(JSON.stringify(data.board));
    turn = data.turn;
    gameOver = false;

    // 履歴削除ボタンを表示
    showDeleteHistory = true;
    document.getElementById("deleteHistoryBtn").style.display = "block";

    // 盤面を表示
    document.getElementById("gameContainer").style.display = "block";

    // 現在のゲームフォルダを新規作成
    const newGame = {
        id: Date.now(),
        name: "Game " + (historyFolders.length + 1),
        history: []
    };
    historyFolders.push(newGame);
    currentGameIndex = historyFolders.length - 1;

    saveSnapshot();
    drawBoard();
    renderHistory();
}

    // フォルダ名を Game 1 に変更
    currentGame.name = "Game 1";

    // 履歴を更新
    historyFolders = [currentGame];

    localStorage.setItem("historyFolders", JSON.stringify(historyFolders));

    // 履歴表示更新

// 履歴のフォルダを表示する関数
function renderFolderHistory(folderIndex){
    const ul = document.getElementById("historyList");
    ul.innerHTML = "";

    const folder = historyFolders[folderIndex];

    folder.history.forEach((snap, snapIndex)=>{
        const li = document.createElement("li");
        li.textContent = `${snapIndex+1}: T${snap.TATE} Y${snap.YOKO} ${snap.turn}`;
        li.style.cursor = "pointer";

        li.onclick = ()=>{
            // 🔹 履歴をロードして盤面を表示
            loadFromFolder(folderIndex, snapIndex);
        };

        ul.appendChild(li);
    });
}
