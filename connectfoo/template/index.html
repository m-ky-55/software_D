<!DOCTYPE html>
<html lang="ja">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>コネクト4 Web版</title>
<style>
body {
    font-family: sans-serif;
    text-align: center;
}

/* 盤面ブロック */
#gameContainer {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* 履歴エリア */
#historyArea {
    position: absolute;
    right: 40px;
    top: 150px;
    width: 300px;
    font-size: 12px;
    overflow-y: auto;
    max-height: 500px;
    text-align: left;
}

#gameContainer {
    display: inline-block;
}

#columnButtons,
#board {
    display: grid;
    gap: 4px;
}

#columnButtons {
    margin-bottom: 10px;
}

/* シリアライズ化 */
#container{
    display:flex;
}
/* ロード */
#historyArea{
    width:300px;
    margin-left:20px;
    font-size:12px;
    overflow-y:auto;
    max-height:500px;
}

.mainButton{
    /* width: 200px;          
    padding: 10px 0;        */
    font-size: 15px;       
    /* font-weight: bold;
    border-radius: 12px;
    margin: 15px;
    cursor: pointer; */
}


.colBtn {
    height: 30px;
    background: #444;
    color: white;
    border: none;
    cursor: pointer;
    font-size: 18px;
}

.colBtn:hover {
    background: orange;
}

.cell {
    width: 40px;
    height: 40px;
    background: #ddd;
    border-radius: 50%;
}

.O { background: red; }
.X { background: blue; }
.hole { background: black; }


label{
    font-size:18px;
    font-weight:bold;
    margin-right:5px;
}

input{
    font-size:16px;
    padding:4px;
}

#exitBtn{
    margin-bottom:15px;
    padding:8px 16px;
    font-size:16px;
    background:#c0392b;
    color:white;
    border:none;
    cursor:pointer;
}

#exitBtn:hover{
    background:#e74c3c;
}


#historyArea{
    position: absolute;
    right: 40px;
    top: 150px;
    width: 300px;
    height: 500px;              /* 高さ固定 */
    display: flex;
    flex-direction: column;
    border: 1px solid #ccc;
    padding: 10px;
}

/* スクロール部分 */
#historyScroll{
    flex: 1;                     /* 余った高さを使う */
    overflow-y: auto;
    margin-bottom: 10px;
}

/* ボタンエリア */
#historyButtons{
    display: flex;
    flex-direction: column;
    gap: 8px;
}

/* ボタン共通 */
#historyButtons button{
    padding: 8px;
    border: none;
    cursor: pointer;
    font-size: 14px;
}

#deleteHistoryBtn{
    background: #555;
    color: white;
}

#deleteHistoryBtn:hover{
    background: #777;
}

#exitBtn{
    background: #c0392b;
    color: white;
}

#exitBtn:hover{
    background: #e74c3c;
}


#historyList{
    overflow-y: auto;
    flex: 1;
    margin-bottom: 10px;
}

#deleteHistoryBtn{
    margin-bottom: 8px;
    padding: 6px;
    background: #555;
    color: white;
    border: none;
    cursor: pointer;
}

#deleteHistoryBtn:hover{
    background: #777;
}

.turnPiece{
    display:inline-block;
    width:20px;
    height:20px;
    border-radius:50%;
    vertical-align:middle;
}

.turnPiece.O{
    background:red;
}

.turnPiece.X{
    background:blue;
}

/* =========================
   スマホ対応
========================= */
@media (max-width: 600px){

    /* absolute解除 */
    #gameContainer{
        position: static;
        transform: none;
        margin-top: 20px;
    }

    #historyArea{
        position: static;
        width: 90%;
        height: auto;
        max-height: 300px;
        margin: 20px auto;
    }

    /* 縦並びにする */
    #container{
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* マスを画面サイズに合わせる */
    .cell{
        width: 10vw;
        height: 10vw;
    }

}



</style>
</head>
<body>

<h2>コネクトX</h2>
<div id="startMenu">
    <button class="mainButton" onclick="selectNewGame()">新規ゲーム開始</button>
    <button class="mainButton" onclick="selectLoadGame()">ロードして開始</button>
</div>
<div id="newGameSettings" style="display:none;">
    横:
<input type="number" id="yoko" min="2" max="35" value="7">

縦:
<input type="number" id="tate" min="2" max="99" value="6">

揃える数:
<input type="number" id="ren" min="2" max="99" value="4">

穴割合(%):
<input type="number" id="holeRate" min="0" max="50" value="20">
    <button class="mainButton" onclick="startGame()">開始</button>
</div>

<h3 id="turnInfo"></h3>

<div id="container">
    <div id="gameContainer">
        <div id="columnButtons"></div>
        <div id="board"></div>
    </div>

    <div id="historyArea">
        <h3>履歴</h3>
    <div id="historyScroll">
        <ul id="historyList"></ul>
        <button id="deleteHistoryBtn" onclick="deleteAllHistory()">
                履歴を削除
            </button>
    </div>
        <!-- 🔽 ボタンエリア（固定） -->
        <div id="historyButtons button">
            
            <button id="exitBtn" onclick="exitGame()" style="display:none;">
                終了
            </button>
        </div>   
    </div>
        
</div>



<script>
let board = [];
let TATE, YOKO, REN;
let turn = "O";
let gameOver = false;
let startMode = null; // "new" | "load"

function selectNewGame(){

    startMode = "new";

    document.getElementById("startMenu").style.display = "none";
    document.getElementById("newGameSettings").style.display = "block";
}


function selectLoadGame(){

    startMode = "load";

    document.getElementById("startMenu").style.display = "none";
    document.getElementById("container").style.display = "flex";
    document.getElementById("exitBtn").style.display = "inline-block";
    document.getElementById("turnInfo").textContent =
        "履歴から選んでください";

    renderHistory();
}


function startGame(){

    if(startMode !== "new"){
        alert("新規ゲームを選択してください");
        return;
    }

    gameOver = false;

    YOKO = parseInt(document.getElementById("yoko").value);
    TATE = parseInt(document.getElementById("tate").value);
    REN  = parseInt(document.getElementById("ren").value);
    

    let holeRate = parseInt(document.getElementById("holeRate").value);

    board = Array.from({length:TATE},()=>Array(YOKO).fill("."));

    let holeCount = Math.floor(TATE*YOKO*holeRate/100);
    let placed = 0;

    while(placed < holeCount){
        let r = Math.floor(Math.random()*TATE);
        let c = Math.floor(Math.random()*YOKO);
        if(board[r][c] === "."){
            board[r][c] = "#";
            placed++;
        }
    }

    turn = "O";

    const newGame = {
        id: Date.now(),
        name: "Game " + (historyFolders.length + 1),
        history: []
    };

    historyFolders.push(newGame);
    currentGameIndex = historyFolders.length - 1;

    saveSnapshot();

    // 🔥 ここでゲーム画面表示
    document.getElementById("newGameSettings").style.display = "none";
    document.getElementById("gameContainer").style.display = "block";
    document.getElementById("container").style.display = "flex";
    document.getElementById("exitBtn").style.display = "inline-block";
    


    drawBoard();
    renderHistory();
}


function drawBoard(){
    let btnDiv = document.getElementById("columnButtons");
    let boardDiv = document.getElementById("board");

    btnDiv.style.gridTemplateColumns = `repeat(${YOKO}, 40px)`;
    boardDiv.style.gridTemplateColumns = `repeat(${YOKO}, 40px)`;

    btnDiv.innerHTML = "";
    boardDiv.innerHTML = "";

    // ▼ ボタン生成
    for(let c=0;c<YOKO;c++){
        let btn = document.createElement("button");
        btn.classList.add("colBtn");
        btn.textContent = "▼";
        btn.onclick = ()=>dropPiece(c);

        if(gameOver){
            btn.disabled = true;
            btn.style.background = "#999";
            btn.style.cursor = "not-allowed";
        }

        btnDiv.appendChild(btn);
    }

    

    // 盤面生成
    for(let r=0;r<TATE;r++){
        for(let c=0;c<YOKO;c++){
            let cell = document.createElement("div");
            cell.classList.add("cell");

            if(board[r][c]==="O") cell.classList.add("O");
            if(board[r][c]==="X") cell.classList.add("X");
            if(board[r][c]==="#") cell.classList.add("hole");

            boardDiv.appendChild(cell);
        }
    }
    document.getElementById("turnInfo").innerHTML =
    `Player <span class="turnPiece ${turn}"></span> の手番（${REN}連続で勝利）`;
    

}

async function dropPiece(col){

    if(gameOver) return;

    let targetRow = -1;

    // 最終着地点を探す
    for(let r=TATE-1;r>=0;r--){
        if(board[r][col] === "#") continue;
        if(board[r][col] === "."){
            targetRow = r;
            break;
        }
    }

    if(targetRow === -1) return;

    gameOver = true; // アニメ中ロック

    // 上から順に仮表示
    for(let r=0; r<=targetRow; r++){

        if(board[r][col] === "#") continue;

        drawBoard(); // 一旦通常描画

        // 仮描画用
        let boardDiv = document.getElementById("board");
        let index = r * YOKO + col;
        let cell = boardDiv.children[index];
        cell.classList.add(turn);

        await new Promise(res => setTimeout(res, 50));
    }

    // 正式に配置
    board[targetRow][col] = turn;

    gameOver = false;

    drawBoard();

    // 勝敗判定
    if(checkWin()){
        gameOver = true;
        alert(`Player ${turn} の勝利！`);
        return;
    }

    if(isFull()){
        gameOver = true;
        alert("引き分け！");
        return;
    }

    turn = (turn==="O")?"X":"O";
    drawBoard();
    saveSnapshot();

}


function checkWin(){
    const dr=[0,1,1,1];
    const dc=[1,0,1,-1];

    for(let r=0;r<TATE;r++){
        for(let c=0;c<YOKO;c++){
            let p=board[r][c];
            if(p==="."||p==="#") continue;

            for(let d=0;d<4;d++){
                let count=1;
                for(let k=1;k<REN;k++){
                    let nr=r+dr[d]*k;
                    let nc=c+dc[d]*k;
                    if(nr<0||nr>=TATE||nc<0||nc>=YOKO) break;
                    if(board[nr][nc]===p) count++;
                    else break;
                }
                if(count===REN) return true;
            }
        }
    }
    return false;
}

function isFull(){
    for(let r=0;r<TATE;r++)
        for(let c=0;c<YOKO;c++)
            if(board[r][c]===".") return false;
    return true;
}

function sleep(ms){
    return new Promise(resolve => setTimeout(resolve, ms));
}

// シリアライズ化関数
function serializeBoard(){

    let flatBoard = board.flat().join(" ");

    return `TATE ${TATE}, YOKO ${YOKO}, TURN ${turn}, REN ${REN}, BOARD ${flatBoard}`;
}


let historyList = [];
let historyFolders = [];
let currentGameIndex = -1;

function saveSnapshot(){

    if(currentGameIndex === -1) return;

    const snapshot = {
        TATE,
        YOKO,
        REN,
        board: JSON.parse(JSON.stringify(board)),
        turn
    };

    historyFolders[currentGameIndex].history.push(snapshot);

    localStorage.setItem("historyFolders", JSON.stringify(historyFolders));

    renderHistory();
}


// 履歴表示関数
function renderHistory(){

    const ul = document.getElementById("historyList");
    ul.innerHTML = "";

    historyFolders.forEach((folder,folderIndex)=>{

        let folderLi = document.createElement("li");
        folderLi.textContent = "📁 " + folder.name;
        folderLi.style.fontWeight = "bold";
        ul.appendChild(folderLi);

        let innerUl = document.createElement("ul");

        folder.history.forEach((snap,snapIndex)=>{

            let li = document.createElement("li");

            let flatBoard = snap.board.flat().join(" ");

            li.textContent =
                `${snapIndex+1}: T${snap.TATE} Y${snap.YOKO} ${snap.turn}`;

            li.style.cursor = "pointer";

            li.onclick = ()=>{

            // 🔒 ゲーム中はロード禁止
            if(currentGameIndex !== -1){
                // alert("ゲーム中はロードできません。終了してください。");
                return;
            }

    loadFromFolder(folderIndex, snapIndex);
};


            innerUl.appendChild(li);
        });

        ul.appendChild(innerUl);
    });
}


// フォルダからロード
function loadFromFolder(folderIndex, snapIndex){

    const data = historyFolders[folderIndex].history[snapIndex];

    // ① 盤面データを取得
    TATE = data.TATE;
    YOKO = data.YOKO;
    REN  = data.REN;
    board = JSON.parse(JSON.stringify(data.board));
    turn = data.turn;

    gameOver = false;

    // ② 新しいフォルダを作る（分岐）
    const newGame = {
        id: Date.now(),
        name: "Game " + (historyFolders.length + 1),
        history: []
    };

    historyFolders.push(newGame);
    currentGameIndex = historyFolders.length - 1;

    // ③ 読み込んだ盤面を初期スナップショットとして保存
    saveSnapshot();

    localStorage.setItem("historyFolders", JSON.stringify(historyFolders));

    // 表示
    document.getElementById("gameContainer").style.display = "block";
    document.getElementById("historyArea").style.display = "block";
    document.getElementById("exitBtn").style.display = "inline-block";
    

    drawBoard();
    renderHistory();
}

// // ページ読み込み時に復元

window.onload = function(){

    // 初期状態はメニューのみ
    document.getElementById("gameContainer").style.display = "none";
    document.getElementById("container").style.display = "none";
    document.getElementById("newGameSettings").style.display = "none";

    const saved = localStorage.getItem("historyFolders");
    if(saved){
        historyFolders = JSON.parse(saved);
    }
};

function exitGame(){
    location.reload();
}



function deleteAllHistory(){

    if(!confirm("本当に履歴をすべて削除しますか？")){
        return;
    }

    historyFolders = [];
    localStorage.removeItem("historyFolders");

    renderHistory();
}


</script>

</body>
</html>
